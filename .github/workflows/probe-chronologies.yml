# 暫時用：查詢各國年表條目數，查完刪除
name: probe-chronologies
on:
  push:
    branches: [claude/project-thread-x2s0da]
    paths: [scripts/probe/probe-chronologies.mts]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/probe/probe-chronologies.mts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/probe/out
          git commit -m "暫時：年表 HTML" && git push
