# 下載「各地朝代」介紹文字（中文維基百科條目開頭），更新 public/data/eras/summaries.json。
# 修改朝代清單或下載腳本並推送後會自動執行；也可在 Actions 頁面手動按「Run workflow」。
name: fetch-eras
on:
  workflow_dispatch:
  push:
    paths:
      - src/lib/eras/regions.ts
      - src/lib/eras/extract.ts
      - scripts/fetch-era-summaries.mts
      - .github/workflows/fetch-eras.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/fetch-era-summaries.mts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/eras/summaries.json
          git commit -m "更新各地朝代介紹文字（自動下載）" || echo "沒有變更"
          git push
