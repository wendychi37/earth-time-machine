# 暫時的探查：列出各國年表頁面在各語言維基百科的大小
name: probe-timelines
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-k3xwgm]
    paths: [scripts/probe-timelines.mjs]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-timelines.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chronology/probe
          git commit -m "探查各國年表頁面（暫時）" || echo "沒有變更"
          git push
